[tool.poetry]
name = "python-concurrency-sandbox"
version = "0.1.0"
description = "Учебный набор задач по многопоточности и конкурентному выполнению в Python"
authors = ["Viktoria Chernysheva"]

[tool.poetry.dependencies]
python = ">=3.10.0,<3.11"
requests = "^2.31.0"
z3 = "^0.2.0"
pillow = "^10.1.0"
t2 = "^1.0.1"
t3 = "^0.1"

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
# https://beta.ruff.rs/docs/configuration/
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
